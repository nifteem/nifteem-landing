<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nifteem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Zetta:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #ea645c;
    --coral-hover: #de5850;
    --sky: #a9d8ef;
    --sky-light: #eef6fb;
    --ink: #14171a;
    --muted: #5b6672;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #ffffff 0%, var(--sky-light) 45%, #ffffff 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: center;
    padding: 40px 24px 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-img {
    height: 44px;
    width: auto;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .hero {
    max-width: 560px;
    text-align: center;
  }
  .hero h1 {
    font-family: 'Lexend Zetta', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 4vw, 34px);
    line-height: 1.3;
    margin: 0 0 22px;
    color: var(--ink);
  }
  .hero p {
    font-size: 17px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 36px;
  }
  .btn {
    display: inline-block;
    background: var(--coral);
    color: #fff;
    text-decoration: none;
    font-family: 'Lexend Zetta', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 16px 40px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(234, 100, 92, 0.35);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn:hover {
    background: var(--coral-hover);
    transform: translateY(-1px);
  }
  .api-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 48px;
    color: var(--coral);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    border: 2px solid var(--coral);
    border-radius: 999px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .api-link svg { flex-shrink: 0; }
  .api-link:hover {
    background: var(--coral);
    color: #fff;
  }
  footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="nifteem-logo.svg" alt="Nifteem" class="logo-img">
    </div>
  </header>

  <main>
    <div class="hero">
      <h1>Bentornato</h1>
      <p>Accedi alla tua area riservata per gestire SMS, RCS e WhatsApp in un unico posto.</p>
      <a class="btn" href="https://app.nifteem.com/login">Accedi</a>
      <br>
      <a class="api-link" href="https://apidoc.nifteem.com/" target="_blank" rel="noopener noreferrer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        Documentazione API REST
      </a>
    </div>
  </main>

  <footer>&copy; 2026 Nifteem</footer>
</body>
</html>
